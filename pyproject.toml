[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veil-cli"
version = "0.1.0"
description = "Check whether a site is blocked in a given country, using OONI data."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
]

[project.scripts]
veil = "app.cli:main"

[tool.setuptools]
packages = ["app"]
